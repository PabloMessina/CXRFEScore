[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cxrfescore"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
]

[project]
name = "cxrfescore"
version = "0.2.1"
authors = [
  { name = "Pablo Messina", email = "pablo.messina.g@gmail.com" },
]
description = "Fact-level embedding metric for evaluating chest X-ray radiology report generation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.8.0",
    "tqdm>=4.65.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7.0",
]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "matplotlib>=3.7.0",
]

[project.urls]
"Homepage" = "https://github.com/PabloMessina/CXRFEScore"
"Bug Tracker" = "https://github.com/PabloMessina/CXRFEScore/issues"
"Paper" = "https://aclanthology.org/2024.findings-acl.236/"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that download Hugging Face models (deselect with '-m \"not integration\"')",
]
addopts = "-m 'not integration'"
